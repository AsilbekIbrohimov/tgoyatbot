<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Qur'on — Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f6f7f4; --card:#ffffff; --text:#16241d; --muted:#6b7d72;
  --accent:#1f7a53; --accent-2:#c9a227; --line:#e4e9e4; --danger:#b3402f;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1512; --card:#182420; --text:#e7efe9; --muted:#93a89b;
  --accent:#3fae7c; --accent-2:#d9b93f; --line:#243530; --danger:#e0705f;
  --shadow:0 1px 3px rgba(0,0,0,.4); color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer}
.app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;font-weight:700;flex:1;text-wrap:balance}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;
  width:38px;height:38px;display:grid;place-items:center;font-size:17px;color:var(--text)}
main{flex:1;padding:14px 16px}
.view{display:none;animation:fade .2s ease}
.view.active{display:block}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;width:100%;text-align:left;color:var(--text)}
.row:active{transform:scale(.995)}
.num{min-width:34px;height:34px;border-radius:9px;background:color-mix(in srgb,var(--accent) 14%,transparent);
  color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:13px}
.row .t{flex:1;min-width:0}
.row .t .en{font-weight:600;font-size:15px}
.row .t .sub{color:var(--muted);font-size:12px;margin-top:2px}
.row .ar{font-family:Amiri,serif;font-size:19px}
.muted{color:var(--muted)}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  margin:18px 2px 8px}
input,select{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:15px}
label.field{display:block;margin:10px 0}
label.field .lab{font-size:13px;color:var(--muted);margin-bottom:5px;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;
  border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:600;font-size:15px;width:100%}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:7px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--text)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Ayah */
.ayah{padding:16px 14px;border-bottom:1px solid var(--line)}
.ayah:last-child{border-bottom:none}
.ayah .head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ayah .badge{font-size:12px;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);
  padding:3px 9px;border-radius:999px;font-weight:600}
.ayah .arabic{font-family:Amiri,serif;font-size:calc(20px * var(--fs,1.15));line-height:2.1;
  text-align:right;direction:rtl;margin:6px 0}
.ayah .translit{color:var(--muted);font-style:italic;font-size:14px;margin:6px 0}
.ayah .trans{font-size:calc(15px * var(--fs,1));line-height:1.7;margin-top:6px}
.ayah.playing{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.ayah .tools{display:flex;gap:6px;margin-top:10px}
.ayah .tools button{background:transparent;border:1px solid var(--line);border-radius:9px;
  padding:6px 10px;font-size:13px;color:var(--muted)}
.bismillah{font-family:Amiri,serif;font-size:26px;text-align:center;padding:18px 0;color:var(--accent)}
/* Tab bar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);max-width:720px;margin:0 auto}
.tabbar button{flex:1;background:none;border:none;padding:9px 4px 8px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}
.tabbar button.on{color:var(--accent)}
.tabbar .ic{font-size:20px;line-height:1}
.loading{text-align:center;color:var(--muted);padding:30px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.prayer{display:flex;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--line)}
.prayer:last-child{border:none}
.prayer.next{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:10px}
.prayer .name{font-weight:600}
.prayer .time{font-variant-numeric:tabular-nums;font-weight:600}
.big{font-size:15px;font-weight:600}
.compass{width:200px;height:200px;margin:16px auto;border-radius:50%;border:2px solid var(--line);
  position:relative;background:var(--card)}
.needle{position:absolute;left:50%;top:12px;bottom:12px;width:4px;margin-left:-2px;
  background:linear-gradient(var(--accent) 50%,var(--muted) 50%);transform-origin:50% 50%;border-radius:4px}
.kaaba{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:18px}
.hint{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
.err{color:var(--danger);font-size:14px;padding:10px 0}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.audio-bar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));
  max-width:720px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);
  padding:8px 14px;display:none;align-items:center;gap:10px;z-index:25}
.audio-bar.on{display:flex}
.audio-bar .title{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="iconbtn" id="backBtn" hidden>‹</button>
    <h1 id="title">Qur'on</h1>
    <button class="iconbtn" id="randomBtn" title="Tasodifiy oyat">🎲</button>
  </header>

  <main>
    <!-- SURALAR -->
    <section class="view active" id="v-suralar">
      <input id="suraFilter" placeholder="Sura qidirish (nomi yoki raqami)..." />
      <div class="list" id="suraList" style="margin-top:12px"><div class="spin"></div></div>
    </section>

    <!-- READER -->
    <section class="view" id="v-reader">
      <div id="readerHead"></div>
      <div class="card" id="ayahBox"><div class="spin"></div></div>
      <div class="grid2" style="margin-top:12px">
        <button class="btn sec" id="prevSura">‹ Oldingi</button>
        <button class="btn sec" id="nextSura">Keyingi ›</button>
      </div>
    </section>

    <!-- QIDIRUV -->
    <section class="view" id="v-search">
      <input id="searchInput" placeholder="Qur'ondan so'z qidiring (o'zbekcha/inglizcha)..." />
      <button class="btn" id="searchBtn" style="margin-top:10px">Qidirish</button>
      <div id="searchResults" style="margin-top:14px"></div>
    </section>

    <!-- NAMOZ -->
    <section class="view" id="v-prayer">
      <div class="pill-row">
        <button class="chip" id="geoBtn">📍 Joylashuvim</button>
      </div>
      <div class="grid2">
        <label class="field"><span class="lab">Shahar</span><input id="pCity" placeholder="Tashkent"></label>
        <label class="field"><span class="lab">Davlat</span><input id="pCountry" placeholder="Uzbekistan"></label>
      </div>
      <label class="field"><span class="lab">Hisoblash usuli</span>
        <select id="pMethod">
          <option value="3">Muslim World League</option>
          <option value="2">ISNA (Shimoliy Amerika)</option>
          <option value="14">Rossiya musulmonlari idorasi</option>
          <option value="1">University of Karachi</option>
          <option value="5">Egypt</option>
          <option value="4">Umm al-Qura (Makka)</option>
        </select>
      </label>
      <button class="btn" id="pGo">Namoz vaqtlarini ko'rsatish</button>
      <div id="prayerResult" style="margin-top:14px"></div>
    </section>

    <!-- KO'PROQ -->
    <section class="view" id="v-more">
      <div class="section-title">Sozlamalar</div>
      <div class="card" style="padding:6px 14px 14px">
        <label class="field"><span class="lab">Tarjima tili</span><select id="setTrans"></select></label>
        <label class="field"><span class="lab">Qori (tilovat)</span><select id="setReciter"></select></label>
        <div class="pill-row">
          <button class="chip" id="setTranslit">🔤 Transliteratsiya</button>
          <button class="chip on" id="setArabic">📖 Arabcha matn</button>
        </div>
        <label class="field"><span class="lab">Shrift o'lchami</span>
          <select id="setFont">
            <option value="0.9">Kichik</option><option value="1" selected>O'rtacha</option>
            <option value="1.2">Katta</option><option value="1.45">Juda katta</option>
          </select></label>
      </div>

      <div class="section-title">Boshqa</div>
      <div class="list">
        <button class="row" id="mJuz"><div class="num">30</div><div class="t"><div class="en">Juzlar</div><div class="sub">30 juz bo'yicha o'qish</div></div><span>›</span></button>
        <button class="row" id="mQibla"><div class="num">🕋</div><div class="t"><div class="en">Qibla</div><div class="sub">Ka'ba yo'nalishi (kompas)</div></div><span>›</span></button>
        <button class="row" id="mHijri"><div class="num">☾</div><div class="t"><div class="en">Hijriy sana</div><div class="sub">Bugungi islomiy sana</div></div><span>›</span></button>
        <button class="row" id="mBookmarks"><div class="num">☆</div><div class="t"><div class="en">Xatcho'plar</div><div class="sub">Saqlangan oyatlar</div></div><span>›</span></button>
      </div>
      <div id="moreDetail" style="margin-top:14px"></div>
      <p class="hint" style="text-align:center;margin-top:20px">Ma'lumot manbai: AlQuran Cloud &amp; Aladhan API</p>
    </section>
  </main>

  <div class="audio-bar" id="audioBar">
    <button class="iconbtn" id="apToggle">▶</button>
    <div class="title" id="apTitle">—</div>
    <label class="chip" style="gap:4px"><input type="checkbox" id="apAuto" style="width:auto"> avto</label>
    <button class="iconbtn" id="apClose">✕</button>
  </div>

  <nav class="tabbar">
    <button data-tab="suralar" class="on"><span class="ic">📖</span>Qur'on</button>
    <button data-tab="search"><span class="ic">🔍</span>Qidiruv</button>
    <button data-tab="prayer"><span class="ic">🕌</span>Namoz</button>
    <button data-tab="more"><span class="ic">⋯</span>Ko'proq</button>
  </nav>
</div>

<audio id="player" preload="none"></audio>

<script>
"use strict";
const TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const API = "https://api.alquran.cloud/v1";
const ALADHAN = "https://api.aladhan.com/v1";
const CDN_AYAH = (rec,n)=>`https://cdn.islamic.network/quran/audio/128/${rec}/${n}.mp3`;
const CDN_SURA = (rec,n)=>`https://cdn.islamic.network/quran/audio-surah/128/${rec}/${n}.mp3`;

/* ---------- Telegram integratsiya ---------- */
if(TG){ try{ TG.ready(); TG.expand(); applyTgTheme(); TG.onEvent('themeChanged',applyTgTheme);}catch(e){} }
function applyTgTheme(){
  if(!TG||!TG.themeParams) return;
  const p=TG.themeParams, r=document.documentElement.style;
  if(p.bg_color) r.setProperty('--bg',p.bg_color);
  if(p.secondary_bg_color) r.setProperty('--card',p.secondary_bg_color);
  if(p.text_color) r.setProperty('--text',p.text_color);
  if(p.hint_color) r.setProperty('--muted',p.hint_color);
  if(p.button_color) r.setProperty('--accent',p.button_color);
  if(p.section_separator_color) r.setProperty('--line',p.section_separator_color);
}
function haptic(t){ try{ TG&&TG.HapticFeedback&&TG.HapticFeedback.impactOccurred(t||'light'); }catch(e){} }

/* ---------- Sozlamalar ---------- */
const DEFAULTS={translation:'en.sahih',reciter:'ar.alafasy',translit:true,arabic:true,font:'1'};
let S=loadSettings();
function loadSettings(){ try{ return Object.assign({},DEFAULTS,JSON.parse(localStorage.getItem('qset')||'{}')); }catch(e){ return {...DEFAULTS}; } }
function saveSettings(){ try{ localStorage.setItem('qset',JSON.stringify(S)); }catch(e){} document.documentElement.style.setProperty('--fs',S.font); }
document.documentElement.style.setProperty('--fs',S.font);

/* ---------- API yordamchilar ---------- */
const cache={};
async function jget(url){
  if(cache[url]) return cache[url];
  const r=await fetch(url); if(!r.ok) throw new Error('network'); const j=await r.json();
  cache[url]=j.data!==undefined?j.data:j; return cache[url];
}

/* ---------- Router ---------- */
const views={suralar:'v-suralar',reader:'v-reader',search:'v-search',prayer:'v-prayer',more:'v-more'};
function show(tab){
  Object.values(views).forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(views[tab]||'v-suralar').classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const titles={suralar:"Qur'on",reader:"Qur'on",search:"Qidiruv",prayer:"Namoz vaqtlari",more:"Ko'proq"};
  document.getElementById('title').textContent=titles[tab]||"Qur'on";
  document.getElementById('backBtn').hidden = tab!=='reader';
  window.scrollTo(0,0);
}
document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>{haptic();show(b.dataset.tab);});
document.getElementById('backBtn').onclick=()=>{haptic();show('suralar');};

/* ---------- Editionlar (tarjima/qori) ---------- */
let SURAS=[];
async function initEditions(){
  // tarjimalar
  try{
    const eds=await jget(API+'/edition?type=translation');
    const sel=document.getElementById('setTrans');
    const pri=['en.sahih','ru.kuliev','tr.diyanet','ur.jalandhry','fr.hamidullah','id.indonesian','de.aburida'];
    eds.sort((a,b)=>pri.indexOf(b.identifier)-pri.indexOf(a.identifier)||a.language.localeCompare(b.language));
    sel.innerHTML=eds.map(e=>`<option value="${e.identifier}">${e.language.toUpperCase()} — ${e.englishName}</option>`).join('');
    sel.value=S.translation;
  }catch(e){}
  // qorilar
  try{
    const eds=await jget(API+'/edition?format=audio&type=versebyverse');
    const sel=document.getElementById('setReciter');
    sel.innerHTML=eds.map(e=>`<option value="${e.identifier}">${e.englishName} (${e.language})</option>`).join('');
    sel.value=S.reciter;
  }catch(e){}
}

/* ---------- Suralar ro'yxati ---------- */
async function initSuras(){
  try{
    SURAS=await jget(API+'/surah');
    renderSuras('');
  }catch(e){ document.getElementById('suraList').innerHTML='<div class="err">Suralar yuklanmadi. Internetni tekshiring.</div>'; }
}
function renderSuras(q){
  const box=document.getElementById('suraList'); q=(q||'').toLowerCase().trim();
  const items=SURAS.filter(s=>!q||String(s.number)===q||s.englishName.toLowerCase().includes(q)||s.name.includes(q));
  box.innerHTML=items.map(s=>`<button class="row" data-sura="${s.number}">
      <div class="num">${s.number}</div>
      <div class="t"><div class="en">${s.englishName}</div>
        <div class="sub">${s.englishNameTranslation} · ${s.numberOfAyahs} oyat · ${s.revelationType==='Meccan'?'Makkiy':'Madaniy'}</div></div>
      <div class="ar">${s.name}</div></button>`).join('') || '<div class="loading">Topilmadi</div>';
  box.querySelectorAll('[data-sura]').forEach(b=>b.onclick=()=>{haptic();openSura(+b.dataset.sura);});
}
document.getElementById('suraFilter').oninput=e=>renderSuras(e.target.value);

/* ---------- Reader ---------- */
let CUR_SURA=null, CUR_AYAHS=[];
async function openSura(n){
  CUR_SURA=n; show('reader');
  document.getElementById('ayahBox').innerHTML='<div class="spin"></div>';
  document.getElementById('readerHead').innerHTML='';
  const eds=['quran-uthmani',S.translation]; if(S.translit) eds.push('en.transliteration');
  try{
    const res=await jget(`${API}/surah/${n}/editions/${eds.join(',')}`);
    const arabic=res[0], trans=res[1], translit=S.translit?res[2]:null;
    const meta=arabic;
    document.getElementById('readerHead').innerHTML=
      `<div style="text-align:center;margin-bottom:10px">
        <div class="ar" style="font-size:26px">${meta.name}</div>
        <div class="big">${meta.englishName}</div>
        <div class="muted" style="font-size:13px">${meta.englishNameTranslation} · ${meta.numberOfAyahs} oyat</div>
        <button class="chip on" id="playSura" style="margin-top:10px">🎧 Butun surani tinglash</button>
      </div>`;
    document.getElementById('playSura').onclick=()=>playSurah(n,meta.englishName);
    CUR_AYAHS=arabic.ayahs;
    const showBism = n!==1 && n!==9;
    let html = showBism?'<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>':'';
    html += arabic.ayahs.map((a,i)=>{
      const no=a.numberInSurah, gid=a.number;
      const bm=isBookmarked(n,no);
      return `<div class="ayah" id="ayah-${no}" data-no="${no}" data-gid="${gid}">
        <div class="head"><span class="badge">${n}:${no}</span></div>
        ${S.arabic?`<div class="arabic">${stripBism(a.text,i,showBism)}</div>`:''}
        ${translit?`<div class="translit">${translit.ayahs[i].text}</div>`:''}
        <div class="trans">${trans.ayahs[i].text}</div>
        <div class="tools">
          <button onclick="playAyah(${no})">▶ Audio</button>
          <button onclick="toggleBookmark(${n},${no},this)">${bm?'★ Saqlangan':'☆ Saqlash'}</button>
          <button onclick="shareAyah(${n},${no})">Ulashish</button>
        </div></div>`;
    }).join('');
    document.getElementById('ayahBox').innerHTML=html;
    saveLast(n);
  }catch(e){ document.getElementById('ayahBox').innerHTML='<div class="err">Sura yuklanmadi.</div>'; }
}
function stripBism(text,i,showBism){
  if(i===0 && showBism){ return text.replace(/^بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\s*/,''); }
  return text;
}
document.getElementById('prevSura').onclick=()=>{ if(CUR_SURA>1) openSura(CUR_SURA-1); };
document.getElementById('nextSura').onclick=()=>{ if(CUR_SURA<114) openSura(CUR_SURA+1); };

/* ---------- Audio ---------- */
const player=document.getElementById('player');
const audioBar=document.getElementById('audioBar');
let playing=null;
function showBar(t){ document.getElementById('apTitle').textContent=t; audioBar.classList.add('on'); }
window.playAyah=function(no){
  const el=document.getElementById('ayah-'+no); if(!el) return;
  document.querySelectorAll('.ayah.playing').forEach(x=>x.classList.remove('playing'));
  el.classList.add('playing');
  player.src=CDN_AYAH(S.reciter, el.dataset.gid); player.play();
  playing={type:'ayah',no}; showBar(`${CUR_SURA}:${no} tilovat`);
  document.getElementById('apToggle').textContent='⏸';
};
function playSurah(n,name){ player.src=CDN_SURA(S.reciter,n); player.play(); playing={type:'surah',n}; showBar(name+' — butun sura'); document.getElementById('apToggle').textContent='⏸'; }
player.onended=()=>{
  if(playing&&playing.type==='ayah'&&document.getElementById('apAuto').checked){
    const next=playing.no+1; if(document.getElementById('ayah-'+next)){ window.playAyah(next); document.getElementById('ayah-'+next).scrollIntoView({behavior:'smooth',block:'center'}); return; }
  }
  document.getElementById('apToggle').textContent='▶';
  document.querySelectorAll('.ayah.playing').forEach(x=>x.classList.remove('playing'));
};
player.onerror=()=>{ document.getElementById('apTitle').textContent='Audio yuklanmadi (bu qori uchun mavjud emas)'; };
document.getElementById('apToggle').onclick=()=>{ if(player.paused){player.play();document.getElementById('apToggle').textContent='⏸';}else{player.pause();document.getElementById('apToggle').textContent='▶';} };
document.getElementById('apClose').onclick=()=>{ player.pause(); audioBar.classList.remove('on'); document.querySelectorAll('.ayah.playing').forEach(x=>x.classList.remove('playing')); };

/* ---------- Ulashish ---------- */
window.shareAyah=async function(n,no){
  const a=CUR_AYAHS.find(x=>x.numberInSurah===no);
  const txt=`Qur'on ${n}:${no}\n\n${a?a.text:''}`;
  if(TG&&TG.switchInlineQuery){ /* not applicable */ }
  try{ await navigator.clipboard.writeText(txt); toast('Nusxa olindi'); }catch(e){ toast('Nusxa olinmadi'); }
};
function toast(m){ if(TG&&TG.showToast){try{TG.showToast(m);return;}catch(e){}} const d=document.createElement('div'); d.textContent=m;
  d.style.cssText='position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:99;font-size:13px'; document.body.appendChild(d); setTimeout(()=>d.remove(),1500); }

/* ---------- Xatcho'p ---------- */
function getBM(){ try{return JSON.parse(localStorage.getItem('qbm')||'[]');}catch(e){return[];} }
function setBM(a){ try{localStorage.setItem('qbm',JSON.stringify(a));}catch(e){} }
function isBookmarked(n,no){ return getBM().some(b=>b.n===n&&b.no===no); }
window.toggleBookmark=function(n,no,btn){
  let a=getBM(); const i=a.findIndex(b=>b.n===n&&b.no===no);
  if(i>=0){a.splice(i,1);btn.textContent='☆ Saqlash';} else {a.push({n,no});btn.textContent='★ Saqlangan';haptic();}
  setBM(a);
};
function saveLast(n){ try{localStorage.setItem('qlast',n);}catch(e){} }

/* ---------- Qidiruv ---------- */
document.getElementById('searchBtn').onclick=doSearch;
document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
async function doSearch(){
  const q=document.getElementById('searchInput').value.trim(); if(!q) return;
  const box=document.getElementById('searchResults'); box.innerHTML='<div class="spin"></div>';
  try{
    const res=await jget(`${API}/search/${encodeURIComponent(q)}/all/${S.translation}`);
    if(!res||!res.matches||!res.count){ box.innerHTML='<div class="loading">Natija topilmadi</div>'; return; }
    box.innerHTML=`<div class="muted" style="margin-bottom:8px">${res.count} ta natija</div>`+
      res.matches.slice(0,50).map(m=>`<button class="row" data-s="${m.surah.number}" data-a="${m.numberInSurah}" style="display:block">
        <div class="badge" style="font-size:12px;color:var(--accent)">${m.surah.englishName} ${m.surah.number}:${m.numberInSurah}</div>
        <div class="trans" style="margin-top:6px">${m.text}</div></button>`).join('');
    box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ openSura(+b.dataset.s).then(()=>{const el=document.getElementById('ayah-'+b.dataset.a); if(el) el.scrollIntoView({behavior:'smooth',block:'center'});}); });
  }catch(e){ box.innerHTML='<div class="err">Qidiruvda xatolik.</div>'; }
}

/* ---------- Namoz vaqtlari ---------- */
document.getElementById('pGo').onclick=()=>{ const c=document.getElementById('pCity').value.trim(); const co=document.getElementById('pCountry').value.trim(); if(c) prayerByCity(c,co); };
document.getElementById('geoBtn').onclick=()=>{
  if(!navigator.geolocation){toast('Geolokatsiya yo‘q');return;}
  navigator.geolocation.getCurrentPosition(p=>prayerByCoords(p.coords.latitude,p.coords.longitude),()=>toast('Joylashuv olinmadi'));
};
function renderPrayer(t){
  const order=[['Fajr','Bomdod'],['Sunrise','Quyosh'],['Dhuhr','Peshin'],['Asr','Asr'],['Maghrib','Shom'],['Isha','Xufton']];
  const now=new Date(), cur=now.getHours()*60+now.getMinutes();
  let nextIdx=-1;
  const times=order.map(([k])=>{const[h,m]=t[k].split(':').map(Number);return h*60+m;});
  for(let i=0;i<times.length;i++){ if(times[i]>cur){nextIdx=i;break;} }
  return `<div class="card">${order.map(([k,uz],i)=>
    `<div class="prayer ${i===nextIdx?'next':''}"><span class="name">${uz}${i===nextIdx?' · keyingi':''}</span><span class="time">${t[k]}</span></div>`).join('')}</div>`;
}
async function prayerByCity(city,country){
  const box=document.getElementById('prayerResult'); box.innerHTML='<div class="spin"></div>';
  const m=document.getElementById('pMethod').value;
  try{ const d=await jget(`${ALADHAN}/timingsByCity?city=${encodeURIComponent(city)}&country=${encodeURIComponent(country||'')}&method=${m}`);
    box.innerHTML=`<div class="section-title">${city}${country?', '+country:''}</div>`+renderPrayer(d.timings)+`<p class="hint">Hijriy: ${d.date.hijri.date} (${d.date.hijri.month.en})</p>`;
  }catch(e){ box.innerHTML='<div class="err">Shahar topilmadi.</div>'; }
}
async function prayerByCoords(lat,lng){
  const box=document.getElementById('prayerResult'); box.innerHTML='<div class="spin"></div>';
  const m=document.getElementById('pMethod').value;
  try{ const d=await jget(`${ALADHAN}/timings?latitude=${lat}&longitude=${lng}&method=${m}`);
    box.innerHTML=`<div class="section-title">Joriy joylashuv</div>`+renderPrayer(d.timings)+`<p class="hint">Hijriy: ${d.date.hijri.date} (${d.date.hijri.month.en})</p>`;
  }catch(e){ box.innerHTML='<div class="err">Vaqtlar olinmadi.</div>'; }
}

/* ---------- Ko'proq: sozlamalar ---------- */
document.getElementById('setTrans').onchange=e=>{S.translation=e.target.value;saveSettings();};
document.getElementById('setReciter').onchange=e=>{S.reciter=e.target.value;saveSettings();};
document.getElementById('setFont').onchange=e=>{S.font=e.target.value;saveSettings();};
document.getElementById('setFont').value=S.font;
function refreshToggles(){ document.getElementById('setTranslit').classList.toggle('on',S.translit); document.getElementById('setArabic').classList.toggle('on',S.arabic); }
document.getElementById('setTranslit').onclick=()=>{S.translit=!S.translit;saveSettings();refreshToggles();};
document.getElementById('setArabic').onclick=()=>{S.arabic=!S.arabic;saveSettings();refreshToggles();};
refreshToggles();

/* ---------- Ko'proq: bo'limlar ---------- */
document.getElementById('mJuz').onclick=()=>showJuz();
document.getElementById('mQibla').onclick=()=>showQibla();
document.getElementById('mHijri').onclick=()=>showHijri();
document.getElementById('mBookmarks').onclick=()=>showBookmarks();
function detail(html){ document.getElementById('moreDetail').innerHTML=html; document.getElementById('moreDetail').scrollIntoView({behavior:'smooth'}); }
function showJuz(){
  detail('<div class="section-title">Juzlar</div><div class="list">'+
    Array.from({length:30},(_,i)=>`<button class="row" data-juz="${i+1}"><div class="num">${i+1}</div><div class="t"><div class="en">${i+1}-juz</div></div><span>›</span></button>`).join('')+'</div>');
  document.getElementById('moreDetail').querySelectorAll('[data-juz]').forEach(b=>b.onclick=()=>openJuz(+b.dataset.juz));
}
async function openJuz(j){
  show('reader'); document.getElementById('readerHead').innerHTML=`<div style="text-align:center" class="big">${j}-juz</div>`;
  document.getElementById('ayahBox').innerHTML='<div class="spin"></div>';
  const eds=['quran-uthmani',S.translation];
  try{ const res=await jget(`${API}/juz/${j}/editions/${eds.join(',')}`);
    const ar=res[0], tr=res[1]; CUR_SURA=null;
    document.getElementById('ayahBox').innerHTML=ar.ayahs.map((a,i)=>`<div class="ayah" id="ayah-${a.number}" data-gid="${a.number}">
      <div class="head"><span class="badge">${a.surah.number}:${a.numberInSurah}</span></div>
      ${S.arabic?`<div class="arabic">${a.text}</div>`:''}
      <div class="trans">${tr.ayahs[i].text}</div>
      <div class="tools"><button onclick="playGid(${a.number},'${a.surah.number}:${a.numberInSurah}')">▶ Audio</button></div></div>`).join('');
  }catch(e){ document.getElementById('ayahBox').innerHTML='<div class="err">Juz yuklanmadi.</div>'; }
}
window.playGid=function(gid,label){ player.src=CDN_AYAH(S.reciter,gid); player.play(); showBar(label+' tilovat'); document.getElementById('apToggle').textContent='⏸'; };
function showHijri(){
  detail('<div class="spin"></div>');
  const d=new Date(), dd=String(d.getDate()).padStart(2,'0'),mm=String(d.getMonth()+1).padStart(2,'0');
  jget(`${ALADHAN}/gToH/${dd}-${mm}-${d.getFullYear()}`).then(r=>{
    const h=r.hijri;
    detail(`<div class="section-title">Bugungi hijriy sana</div><div class="card" style="padding:20px;text-align:center">
      <div style="font-size:26px;font-weight:700">${h.day} ${h.month.en} ${h.year}</div>
      <div class="ar" style="font-size:22px;margin-top:6px">${h.month.ar}</div>
      <div class="muted" style="margin-top:8px">${h.weekday.en} · ${h.designation.abbreviated}</div></div>`);
  }).catch(()=>detail('<div class="err">Sana olinmadi.</div>'));
}
function showBookmarks(){
  const a=getBM();
  if(!a.length){ detail('<div class="loading">Xatcho\'plar yo\'q. Oyat o\'qiyotganda ☆ tugmasini bosing.</div>'); return; }
  detail('<div class="section-title">Xatcho\'plar</div><div class="list">'+a.map(b=>`<button class="row" data-s="${b.n}" data-a="${b.no}"><div class="num">${b.n}:${b.no}</div><div class="t"><div class="en">Sura ${b.n}, oyat ${b.no}</div></div><span>›</span></button>`).join('')+'</div>');
  document.getElementById('moreDetail').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>openSura(+b.dataset.s).then(()=>{const el=document.getElementById('ayah-'+b.dataset.a);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}));
}
/* ---------- Qibla ---------- */
let qiblaDir=null;
function showQibla(){
  detail(`<div class="section-title">Qibla yo'nalishi</div>
    <div class="card" style="padding:16px;text-align:center">
      <div class="compass"><div class="kaaba">🕋</div><div class="needle" id="needle"></div></div>
      <div id="qiblaInfo" class="muted">Joylashuvga ruxsat bering</div>
      <button class="btn" id="qiblaGeo" style="margin-top:10px">📍 Yo'nalishni aniqlash</button>
      <button class="btn sec" id="qiblaComp" style="margin-top:8px">🧭 Kompasni yoqish</button>
      <p class="hint">Telefonni tekis ushlang. Ko'k strelka qiblani ko'rsatadi.</p>
    </div>`);
  document.getElementById('qiblaGeo').onclick=()=>{
    if(!navigator.geolocation){toast('Geolokatsiya yo‘q');return;}
    navigator.geolocation.getCurrentPosition(async p=>{
      try{ const d=await jget(`${ALADHAN}/qibla/${p.coords.latitude}/${p.coords.longitude}`);
        qiblaDir=d.direction; document.getElementById('qiblaInfo').textContent=`Qibla: shimoldan ${Math.round(qiblaDir)}° (soat yo'nalishi bo'yicha)`;
        setNeedle(qiblaDir);
      }catch(e){document.getElementById('qiblaInfo').textContent='Yo\'nalish olinmadi';}
    },()=>toast('Joylashuv olinmadi'));
  };
  document.getElementById('qiblaComp').onclick=enableCompass;
}
function setNeedle(deg,heading){ const n=document.getElementById('needle'); if(n) n.style.transform=`rotate(${deg-(heading||0)}deg)`; }
function enableCompass(){
  function handler(e){ const h=e.webkitCompassHeading!==undefined?e.webkitCompassHeading:(360-(e.alpha||0)); if(qiblaDir!=null) setNeedle(qiblaDir,h); }
  if(typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission){
    DeviceOrientationEvent.requestPermission().then(s=>{ if(s==='granted') window.addEventListener('deviceorientation',handler,true); else toast('Kompasga ruxsat berilmadi'); }).catch(()=>toast('Kompas ishlamadi'));
  } else { window.addEventListener('deviceorientationabsolute',handler,true); window.addEventListener('deviceorientation',handler,true); }
}

      <button class="btn" style="margin-top:12px" onclick="openSura(${ar.surah.number})">Surani ochish</button></div>`);
