<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Qur'on — Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <header>
    <button class="iconbtn" id="backBtn" hidden>‹</button>
    <h1 id="title">Qur'on</h1>
    <button class="iconbtn" id="randomBtn" title="Tasodifiy oyat">🎲</button>
  </header>

  <main>
    <!-- SURALAR -->
    <section class="view active" id="v-suralar">
      <input id="suraFilter" placeholder="Sura qidirish (nomi yoki raqami)..." />
      <div class="list" id="suraList" style="margin-top:12px"><div class="spin"></div></div>
    </section>

    <!-- READER -->
    <section class="view" id="v-reader">
      <div id="readerHead"></div>
      <div class="card" id="ayahBox"><div class="spin"></div></div>
      <div class="grid2" style="margin-top:12px">
        <button class="btn sec" id="prevSura">‹ Oldingi</button>
        <button class="btn sec" id="nextSura">Keyingi ›</button>
      </div>
    </section>

    <!-- QIDIRUV -->
    <section class="view" id="v-search">
      <input id="searchInput" placeholder="Qur'ondan so'z qidiring..." />
      <button class="btn" id="searchBtn" style="margin-top:10px">Qidirish</button>
      <div id="searchResults" style="margin-top:14px"></div>
    </section>

    <!-- NAMOZ -->
    <section class="view" id="v-prayer">
      <div class="pill-row">
        <button class="chip" id="geoBtn">📍 Joylashuvim</button>
      </div>
      <div class="grid2">
        <label class="field"><span class="lab">Shahar</span><input id="pCity" placeholder="Tashkent"></label>
        <label class="field"><span class="lab">Davlat</span><input id="pCountry" placeholder="Uzbekistan"></label>
      </div>
      <label class="field"><span class="lab">Hisoblash usuli</span>
        <select id="pMethod">
          <option value="3">Muslim World League</option>
          <option value="2">ISNA (Shimoliy Amerika)</option>
          <option value="14">Rossiya musulmonlari idorasi</option>
          <option value="1">University of Karachi</option>
          <option value="5">Egypt</option>
          <option value="4">Umm al-Qura (Makka)</option>
        </select>
      </label>
      <button class="btn" id="pGo">Namoz vaqtlarini ko'rsatish</button>
      <div id="prayerResult" style="margin-top:14px"></div>
    </section>

    <!-- KO'PROQ -->
    <section class="view" id="v-more">
      <div class="section-title">Sozlamalar</div>
      <div class="card" style="padding:6px 14px 14px">
        <label class="field"><span class="lab">Tarjima tili</span><select id="setTrans"></select></label>
        <label class="field"><span class="lab">Qori (tilovat)</span><select id="setReciter"></select></label>
        <div class="pill-row">
          <button class="chip" id="setTranslit">🔤 Transliteratsiya</button>
          <button class="chip on" id="setArabic">📖 Arabcha matn</button>
        </div>
        <label class="field"><span class="lab">Shrift o'lchami</span>
          <select id="setFont">
            <option value="0.9">Kichik</option><option value="1">O'rtacha</option>
            <option value="1.2">Katta</option><option value="1.45">Juda katta</option>
          </select></label>
      </div>

      <div class="section-title">Boshqa</div>
      <div class="list">
        <button class="row" id="mJuz"><div class="num">30</div><div class="t"><div class="en">Juzlar</div><div class="sub">30 juz bo'yicha o'qish</div></div><span>›</span></button>
        <button class="row" id="mQibla"><div class="num">🕋</div><div class="t"><div class="en">Qibla</div><div class="sub">Ka'ba yo'nalishi (kompas)</div></div><span>›</span></button>
        <button class="row" id="mHijri"><div class="num">☾</div><div class="t"><div class="en">Hijriy sana</div><div class="sub">Bugungi islomiy sana</div></div><span>›</span></button>
        <button class="row" id="mBookmarks"><div class="num">☆</div><div class="t"><div class="en">Xatcho'plar</div><div class="sub">Saqlangan oyatlar</div></div><span>›</span></button>
      </div>
      <div id="moreDetail" style="margin-top:14px"></div>
      <p class="hint" style="text-align:center;margin-top:20px">Ma'lumot manbai: AlQuran Cloud &amp; Aladhan API</p>
    </section>
  </main>

  <div class="audio-bar" id="audioBar">
    <button class="iconbtn" id="apToggle">▶</button>
    <div class="title" id="apTitle">—</div>
    <label class="chip" style="gap:4px"><input type="checkbox" id="apAuto" style="width:auto"> avto</label>
    <button class="iconbtn" id="apClose">✕</button>
  </div>

  <nav class="tabbar">
    <button data-tab="suralar" class="on"><span class="ic">📖</span>Qur'on</button>
    <button data-tab="search"><span class="ic">🔍</span>Qidiruv</button>
    <button data-tab="prayer"><span class="ic">🕌</span>Namoz</button>
    <button data-tab="more"><span class="ic">⋯</span>Ko'proq</button>
  </nav>
</div>

<audio id="player" preload="none"></audio>

<script type="module" src="js/main.js"></script>
</body>
</html>
